name: NetSuite e2e
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the run
        required: false
        default: "20"
        type: string
      test-command:
        description: npm script to run (from the repo's package.json)
        required: false
        default: npm run test:e2e
        type: string
    secrets:
      E2E_PKG_TOKEN:
        description: Read token for the private @cofficient/netsuite-e2e git dependency
        required: true

# All other credentials (NS_BASE_URL/USERNAME/PASSWORD/TOTP_SECRET, TESTINY_API_KEY,
# TESTINY_PROJECT_ID, ...) are project-specific and reach this workflow through the
# caller's `secrets: inherit`.
env:
  NS_BASE_URL: ${{ secrets.NS_BASE_URL }}
  NS_USERNAME: ${{ secrets.NS_USERNAME }}
  NS_PASSWORD: ${{ secrets.NS_PASSWORD }}
  NS_TOTP_SECRET: ${{ secrets.NS_TOTP_SECRET }}
  TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}
  TESTINY_PROJECT_ID: ${{ secrets.TESTINY_PROJECT_ID }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The private git dependency (@cofficient/netsuite-e2e) is fetched by npm
      # during `npm ci`; route git through the read token.
      - name: Allow npm to fetch private git dependencies
        run: git config --global url."https://x-access-token:${{ secrets.E2E_PKG_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      # System dependencies for the browser channel (chrome is preinstalled on
      # ubuntu-latest images; only its OS libraries are missing).
      - name: Install Playwright system dependencies
        run: npx playwright install-deps

      - name: Run e2e suite
        run: ${{ inputs.test-command }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 30