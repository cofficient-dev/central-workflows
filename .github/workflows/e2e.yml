name: NetSuite e2e
on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version for the run
        required: false
        default: "20"
        type: string
      test-command:
        description: npm script to run (from the repo's package.json)
        required: false
        default: npm run test:e2e
        type: string
      auth-dir:
        description: Auth storage dir (must match the authDir option in the repo's playwright config); cleared for a fresh login when fresh-login is true
        required: false
        default: ".auth"
        type: string
      fresh-login:
        description: Delete the cached auth state before the run (CI never has a useful cache)
        required: false
        default: true
        type: boolean
      testiny-project-key:
        description: Testiny project key, if the suite reports to Testiny
        required: false
        type: string
      testiny-project-id:
        description: Testiny project id, if the suite reports to Testiny
        required: false
        type: string
      testiny-run-title:
        description: Testiny run title prefix (TESTINY_RUN_TITLE); package default when empty
        required: false
        type: string
      timeout-minutes:
        description: Job time limit in minutes (suites that drive integration flows run longer)
        required: false
        default: 90
        type: number
    secrets:
      E2E_PKG_TOKEN:
        description: Read token for the private @cofficient/netsuite-e2e git dependency
        required: true
      E2E_EXTRA_ENV:
        description: Optional multiline KEY=value lines exported to the job env (repo-specific test settings)
        required: false
      NS_BASE_URL:
        required: false
      NS_USERNAME:
        required: false
      NS_PASSWORD:
        required: false
      NS_TOTP_SECRET:
        required: false
      TESTINY_API_KEY:
        required: false

jobs:
  e2e:
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 from 19/10/2026
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Secrets go in as environment variables, not a generated .env: no shell
    # expansion of $ or backticks, and no dotenv truncation at an unquoted #.
    env:
      CI: "true"
      NS_BASE_URL: ${{ secrets.NS_BASE_URL }}
      NS_USERNAME: ${{ secrets.NS_USERNAME }}
      NS_PASSWORD: ${{ secrets.NS_PASSWORD }}
      NS_TOTP_SECRET: ${{ secrets.NS_TOTP_SECRET }}
      TESTINY_API_KEY: ${{ secrets.TESTINY_API_KEY }}
      TESTINY_PROJECT_ID: ${{ inputs.testiny-project-id }}
      TESTINY_PROJECT_KEY: ${{ inputs.testiny-project-key }}
      TESTINY_RUN_TITLE: ${{ inputs.testiny-run-title }}
    steps:
      # No persisted credentials: checkout's GITHUB_TOKEN auth header would apply to every
      # github.com request in the workspace and override E2E_PKG_TOKEN, so npm ci could not
      # fetch the private @cofficient/netsuite-e2e ("Repository not found").
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Export repo-specific env
        env:
          E2E_EXTRA_ENV: ${{ secrets.E2E_EXTRA_ENV }}
        # GitHub masks a secret only as one whole string, so each value taken out of this
        # multi-line secret is masked on its own before it reaches the job env; otherwise the
        # runner prints it in clear in every later step's env listing.
        run: |
          if [ -n "$E2E_EXTRA_ENV" ]; then
            printf '%s\n' "$E2E_EXTRA_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' | while IFS= read -r line; do
              value="${line#*=}"
              if [ -n "$value" ]; then echo "::add-mask::$value"; fi
              printf '%s\n' "$line" >> "$GITHUB_ENV"
            done
          fi

      # The private git dependency (@cofficient/netsuite-e2e) is fetched by npm
      # during `npm ci`; route git through the read token. npm writes `github:`
      # dependencies to the lockfile as git+ssh URLs, and the runner has no SSH
      # key, so the SSH forms are rewritten to the token as well.
      - name: Allow npm to fetch private git dependencies
        run: |
          base='url.https://x-access-token:${{ secrets.E2E_PKG_TOKEN }}@github.com/.insteadOf'
          git config --global --add "$base" "https://github.com/"
          git config --global --add "$base" "ssh://git@github.com/"
          git config --global --add "$base" "git@github.com:"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # System dependencies for the browser channel (chrome is preinstalled on
      # ubuntu-latest images; only its OS libraries are missing).
      - name: Install Playwright system dependencies
        # install-deps covers system libraries only; video recording also needs Playwright's ffmpeg.
        run: |
          npx playwright install-deps
          npx playwright install ffmpeg

      - name: Remove cached auth (force fresh login)
        if: ${{ inputs.fresh-login }}
        run: rm -f "${{ inputs.auth-dir }}/user.json"

      - name: Run e2e suite
        run: ${{ inputs.test-command }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7