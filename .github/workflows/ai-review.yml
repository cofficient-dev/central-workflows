name: AI Code Review
on:
  workflow_call:
    secrets:
      OLLAMA_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    # A review is advisory, so it should never occupy a runner for the multi hour default.
    timeout-minutes: 25
    # Single source of truth. This was previously declared twice, once for the API call and
    # once for the comment header, and the two drifted: reviews ran on glm-5.2:cloud while
    # the posted header claimed glm-5.3-flash. Declare it here so the two cannot disagree.
    env:
      # Must be the exact Ollama tag, including the :cloud suffix. This value is sent as the
      # model in the API request, so a prettified name here fails the request outright.
      MODEL: "glm-5.3-flash:cloud"
      # Diff cap in bytes, set by latency rather than context window. The 1M context is not the
      # binding constraint, the 900s curl budget is. Two measurements of glm-5.3-flash on the
      # same content:
      #   366KB prompt -> 707s (518 bytes/s)
      #   149KB prompt -> 179s (830 bytes/s)
      # Throughput degrades as the prompt grows, so latency is superlinear and the faster
      # small-prompt figure must NOT be used to extrapolate. Sizing off the slower 518 bytes/s
      # gives roughly 460KB of prompt inside 900s, and valid_lines now adds under 10% on top of
      # the diff, hence 500KB. Deliberately conservative because of that superlinearity.
      # Truncating to something the model can finish beats sending everything and timing out
      # with nothing to show. If large PRs fail on curl exit 28, lower this before raising the
      # timeout.
      MAX_DIFF_BYTES: "500000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          SIZE=$(wc -c < diff.txt)
          echo "Diff size: $SIZE bytes (cap $MAX_DIFF_BYTES)"
          if [ $SIZE -gt $MAX_DIFF_BYTES ]; then
            head -c $MAX_DIFF_BYTES diff.txt > diff_trimmed.txt && mv diff_trimmed.txt diff.txt
            echo "::warning::Diff exceeded $MAX_DIFF_BYTES bytes and was truncated. Review is partial."
          fi

      - name: Parse valid diff lines
        run: |
          python3 << 'EOF'
          import re, json

          # {path: [line, ...]} rather than [{path, line}, ...]. The flat form repeated the
          # full file path on every single line: measured on a 137KB diff it produced 229KB of
          # JSON, 62% of the whole prompt and larger than the code under review. Grouping by
          # file drops that to a few percent. Kept as explicit line numbers, not ranges, so the
          # model only has to pick a value from a list rather than expand a range correctly.
          valid_lines = {}  # {path: [line, ...]}
          current_file = None
          current_line = None

          with open("diff.txt") as f:
            for raw in f:
              line = raw.rstrip("\n")

              # Detect file path from diff header.
              # git appends a trailing tab to this line when the path contains a space, so a
              # greedy capture pulls the tab into the filename. That corrupted path then went
              # into valid_lines, the model was told it was valid and commented on it, the
              # validation below compared against the same corrupted value and let it through,
              # and GitHub rejected the whole review. Strip the separator.
              m = re.match(r'^\+\+\+ b/(.*)$', line)
              if m:
                current_file = m.group(1).rstrip('\t')
                current_line = None
                continue

              # Detect hunk header e.g. @@ -10,7 +10,9 @@
              m = re.match(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@', line)
              if m:
                current_line = int(m.group(1))
                continue

              if current_file is None or current_line is None:
                continue

              if line.startswith('+'):
                # Added line, valid for comment
                valid_lines.setdefault(current_file, []).append(current_line)
                current_line += 1
              elif line.startswith('-'):
                # Removed line, do not increment new-file line counter
                pass
              else:
                # Context line
                valid_lines.setdefault(current_file, []).append(current_line)
                current_line += 1

          with open("valid_lines.json", "w") as f:
            json.dump(valid_lines, f, separators=(',', ':'))

          total = sum(len(v) for v in valid_lines.values())
          size = len(json.dumps(valid_lines, separators=(',', ':')))
          print(f"Found {total} valid commentable lines across {len(valid_lines)} files ({size} bytes of JSON)")
          EOF

      - name: AI Review
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          jq -n \
            --arg model "$MODEL" \
            --rawfile diff diff.txt \
            --rawfile valid_lines valid_lines.json \
            '{
              model: $model,
              messages: [{
                role: "user",
                content: ("You are an expert code reviewer. Review this PR diff.\n\nYou MUST only comment on a file and line that appears in this map of valid targets. It is a JSON object keyed by file path, and each value is the list of line numbers GitHub will accept a comment on for that file. A path or line outside this map will be discarded:\n" + $valid_lines + "\n\nReturn ONLY a JSON object in this exact format, no markdown, no explanation. Your entire response must begin with the { character and end with the } character, with no preamble text before it and no code fence around it:\n{\n  \"summary\": \"Overall review summary\",\n  \"comments\": [\n    {\n      \"path\": \"path/to/file.js\",\n      \"line\": 42,\n      \"body\": \"Your inline comment here\"\n    }\n  ]\n}\n\nRules:\n- path and line must exactly match an entry from the valid lines list above\n- Only review and comment on files that were changed in this PR, and do NOT post inline comments on unchanged files\n- Post an inline comment ONLY when the evidence for it is visible in this diff. You are shown the diff, not the whole repository, so unchanged lines are invisible to you even inside a file that was changed. If a finding depends on code you cannot see, such as the body of a function that was not modified, a caller outside the diff, or a file not included here, do NOT assert it as an inline comment: put it in the summary, phrased as something to verify\n- Removed imports and changed signatures are the common trap here. You can see the removal but not every use of it, so ask in the summary rather than claiming a break. Do not tell the author code is broken unless the broken code is in front of you\n- Only flag genuine issues: bugs, security problems, missing error handling, significant improvements\n- No style nitpicks\n- summary should be 2-3 sentences, followed by a short \"To verify\" list if and only if you have findings that depend on code not shown in the diff\n\nDiff:\n" + $diff)
              }]
            }' > payload.json

          # --max-time bounds the call. An invalid model tag does not get rejected quickly, it
          # hangs, and with no timeout the step sat for minutes against the job's multi hour
          # default. --fail-with-body still gives us the response body on an HTTP error so the
          # check below can report it.
          RESPONSE=$(curl -s --max-time 900 --fail-with-body https://ollama.com/v1/chat/completions \
            -H "Authorization: Bearer $OLLAMA_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json) || CURL_EXIT=$?

          if [ -n "${CURL_EXIT:-}" ]; then
            echo "curl failed with exit $CURL_EXIT after up to 900s. Response body, if any:"
            echo "$RESPONSE"
            exit 1
          fi

          ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
          if [ -n "$ERROR" ]; then
            echo "API error: $ERROR"
            exit 1
          fi

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > review_raw.txt
          cat review_raw.txt

          # The model does not reliably return bare JSON. glm-5.3-flash prefixes prose such as
          # "I'll review this PR diff. Let me analyze the changes" and wraps the object in a
          # fence, and stripping fences alone left that prose in place, so JSON.parse failed and
          # the whole review fell back to a plain comment with no inline anchoring.
          # Extract the first balanced JSON object instead. Brace matching has to be string
          # aware because comment bodies legitimately contain braces, and it has to tolerate a
          # stray brace in the preamble, so try each candidate start until one parses.
          python3 << 'EOF'
          import json, sys

          raw = open("review_raw.txt", encoding="utf-8").read()

          def extract(text, start):
            depth = 0
            in_str = False
            esc = False
            for i in range(start, len(text)):
              ch = text[i]
              if in_str:
                if esc:
                  esc = False
                elif ch == '\\':
                  esc = True
                elif ch == '"':
                  in_str = False
                continue
              if ch == '"':
                in_str = True
              elif ch == '{':
                depth += 1
              elif ch == '}':
                depth -= 1
                if depth == 0:
                  return text[start:i + 1]
            return None

          obj = None
          pos = raw.find('{')
          while pos != -1 and obj is None:
            candidate = extract(raw, pos)
            if candidate:
              try:
                obj = json.loads(candidate)
              except json.JSONDecodeError:
                obj = None
            pos = raw.find('{', pos + 1)

          if obj is None:
            print("Could not extract a JSON object from the model output")
            sys.exit(1)

          with open("review.json", "w", encoding="utf-8") as f:
            json.dump(obj, f)

          print(f"Extracted JSON with {len(obj.get('comments', []))} comments")
          EOF

          echo "Parsed JSON:"
          cat review.json

      - name: Post inline review comments
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const model = process.env.MODEL;

            // Load valid lines for server-side validation.
            // Shape is {path: [line, ...]}, grouped by file to keep the prompt small.
            const validLines = JSON.parse(fs.readFileSync('valid_lines.json', 'utf8'));
            const validSet = new Set();
            for (const [path, lines] of Object.entries(validLines)) {
              for (const line of lines) {
                validSet.add(`${path}:${line}`);
              }
            }

            let review;
            try {
              review = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            } catch (e) {
              console.error('Failed to parse review JSON:', e.message);
              const raw = fs.readFileSync('review_raw.txt', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 AI Code Review (${model})\n\n${raw}`
              });
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commitId = pr.data.head.sha;

            // Filter to only comments whose path+line exist in the diff
            const validComments = (review.comments || []).filter(c => {
              const key = `${c.path}:${c.line}`;
              if (!validSet.has(key)) {
                console.warn(`Skipping invalid line reference: ${key}`);
                return false;
              }
              return true;
            });

            console.log(`Posting ${validComments.length} inline comments (${(review.comments || []).length - validComments.length} skipped as invalid)`);

            const reviewBody = `## 🤖 AI Code Review (${model})\n\n${review.summary || ''}`;

            // createReview is all or nothing: one path GitHub will not accept discards the
            // entire review, summary included. Fall back to posting the summary and the
            // findings as a plain comment so the output is never silently lost.
            try {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                commit_id: commitId,
                body: reviewBody,
                event: 'COMMENT',
                comments: validComments.map(c => ({
                  path: c.path,
                  line: c.line,
                  body: c.body
                }))
              });
            } catch (e) {
              console.error(`createReview failed: ${e.message}`);
              const rendered = validComments
                .map(c => `- **${c.path}:${c.line}**\n  ${c.body.replace(/\n/g, '\n  ')}`)
                .join('\n\n');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `${reviewBody}\n\n> Inline comments could not be attached (${e.message}), so they are listed here.\n\n${rendered}`
              });
            }
