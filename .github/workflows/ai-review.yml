name: AI Code Review
on:
  workflow_call:
    secrets:
      OLLAMA_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Single source of truth. This was previously declared twice, once for the API call and
    # once for the comment header, and the two drifted: reviews ran on glm-5.2:cloud while
    # the posted header claimed glm-5.3-flash. Declare it here so the two cannot disagree.
    env:
      MODEL: "glm-5.3-flash"
      # Diff cap in bytes. The prompt carries the diff plus valid_lines.json, and that JSON
      # repeats the file path for every commentable line, so it grows at roughly the same
      # rate as the diff itself. Budget about 2 bytes of prompt per byte of diff, at roughly
      # 3.5 chars per token, and 1.5MB lands near 850K tokens. That leaves headroom inside
      # glm-5.3-flash's 1M context for the response. Raise this only alongside the model.
      MAX_DIFF_BYTES: "1500000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > diff.txt
          SIZE=$(wc -c < diff.txt)
          echo "Diff size: $SIZE bytes (cap $MAX_DIFF_BYTES)"
          if [ $SIZE -gt $MAX_DIFF_BYTES ]; then
            head -c $MAX_DIFF_BYTES diff.txt > diff_trimmed.txt && mv diff_trimmed.txt diff.txt
            echo "::warning::Diff exceeded $MAX_DIFF_BYTES bytes and was truncated. Review is partial."
          fi

      - name: Parse valid diff lines
        run: |
          python3 << 'EOF'
          import re, json

          valid_lines = []  # [{path, line}]
          current_file = None
          current_line = None

          with open("diff.txt") as f:
            for raw in f:
              line = raw.rstrip("\n")

              # Detect file path from diff header
              m = re.match(r'^\+\+\+ b/(.+)$', line)
              if m:
                current_file = m.group(1)
                current_line = None
                continue

              # Detect hunk header e.g. @@ -10,7 +10,9 @@
              m = re.match(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@', line)
              if m:
                current_line = int(m.group(1))
                continue

              if current_file is None or current_line is None:
                continue

              if line.startswith('+'):
                # Added line — valid for comment
                valid_lines.append({"path": current_file, "line": current_line})
                current_line += 1
              elif line.startswith('-'):
                # Removed line — do not increment new-file line counter
                pass
              else:
                # Context line
                valid_lines.append({"path": current_file, "line": current_line})
                current_line += 1

          with open("valid_lines.json", "w") as f:
            json.dump(valid_lines, f)

          print(f"Found {len(valid_lines)} valid commentable lines across {len(set(v['path'] for v in valid_lines))} files")
          EOF

      - name: AI Review
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          jq -n \
            --arg model "$MODEL" \
            --rawfile diff diff.txt \
            --rawfile valid_lines valid_lines.json \
            '{
              model: $model,
              messages: [{
                role: "user",
                content: ("You are an expert code reviewer. Review this PR diff.\n\nYou MUST only reference lines from this exact list of valid file+line combinations (these are the only lines GitHub will accept comments on):\n" + $valid_lines + "\n\nReturn ONLY a JSON object in this exact format, no markdown, no explanation:\n{\n  \"summary\": \"Overall review summary\",\n  \"comments\": [\n    {\n      \"path\": \"path/to/file.js\",\n      \"line\": 42,\n      \"body\": \"Your inline comment here\"\n    }\n  ]\n}\n\nRules:\n- path and line must exactly match an entry from the valid lines list above\n- Only review and comment on files that were changed in this PR, and do NOT post inline comments on unchanged files\n- Post an inline comment ONLY when the evidence for it is visible in this diff. You are shown the diff, not the whole repository, so unchanged lines are invisible to you even inside a file that was changed. If a finding depends on code you cannot see, such as the body of a function that was not modified, a caller outside the diff, or a file not included here, do NOT assert it as an inline comment: put it in the summary, phrased as something to verify\n- Removed imports and changed signatures are the common trap here. You can see the removal but not every use of it, so ask in the summary rather than claiming a break. Do not tell the author code is broken unless the broken code is in front of you\n- Only flag genuine issues: bugs, security problems, missing error handling, significant improvements\n- No style nitpicks\n- summary should be 2-3 sentences, followed by a short \"To verify\" list if and only if you have findings that depend on code not shown in the diff\n\nDiff:\n" + $diff)
              }]
            }' > payload.json

          RESPONSE=$(curl -s https://ollama.com/v1/chat/completions \
            -H "Authorization: Bearer $OLLAMA_API_KEY" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          ERROR=$(echo "$RESPONSE" | jq -r '.error // empty')
          if [ -n "$ERROR" ]; then
            echo "API error: $ERROR"
            exit 1
          fi

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > review_raw.txt
          cat review_raw.txt

          # Strip any markdown fences the model may have added
          sed 's/```json//g; s/```//g' review_raw.txt | tr -d '\r' > review.json
          echo "Parsed JSON:"
          cat review.json

      - name: Post inline review comments
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const model = process.env.MODEL;

            // Load valid lines for server-side validation
            const validLines = JSON.parse(fs.readFileSync('valid_lines.json', 'utf8'));
            const validSet = new Set(validLines.map(v => `${v.path}:${v.line}`));

            let review;
            try {
              review = JSON.parse(fs.readFileSync('review.json', 'utf8'));
            } catch (e) {
              console.error('Failed to parse review JSON:', e.message);
              const raw = fs.readFileSync('review_raw.txt', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🤖 AI Code Review (${model})\n\n${raw}`
              });
              return;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const commitId = pr.data.head.sha;

            // Filter to only comments whose path+line exist in the diff
            const validComments = (review.comments || []).filter(c => {
              const key = `${c.path}:${c.line}`;
              if (!validSet.has(key)) {
                console.warn(`Skipping invalid line reference: ${key}`);
                return false;
              }
              return true;
            });

            console.log(`Posting ${validComments.length} inline comments (${(review.comments || []).length - validComments.length} skipped as invalid)`);

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              commit_id: commitId,
              body: `## 🤖 AI Code Review (${model})\n\n${review.summary || ''}`,
              event: 'COMMENT',
              comments: validComments.map(c => ({
                path: c.path,
                line: c.line,
                body: c.body
              }))
            });
